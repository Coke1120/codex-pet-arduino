<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#10243b"/></linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#62d6ff"/></marker>
    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-opacity=".25"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#17324f" stroke-width="1"/></pattern>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/><rect width="1400" height="900" fill="url(#grid)" opacity=".55"/>
  <text x="70" y="74" fill="#fff" font-family="Arial,sans-serif" font-size="38" font-weight="700">Arduino Uno R3 → 1.8&quot; ST7735S TFT</text>
  <text x="70" y="112" fill="#9fb8cf" font-family="Arial,sans-serif" font-size="20">Direct wiring — only for the verified 5V-compatible TFT breakout</text>

  <!-- wires behind boards -->
  <g fill="none" stroke-width="7" stroke-linecap="round">
    <path d="M486 240 C650 240 720 216 905 216" stroke="#ff5e5e"/>
    <path d="M486 305 C650 305 720 281 905 281" stroke="#ff9f43"/>
    <path d="M486 370 C650 370 720 346 905 346" stroke="#ffd43b"/>
    <path d="M486 435 C650 435 720 411 905 411" stroke="#6ee7b7"/>
    <path d="M486 500 C650 500 720 476 905 476" stroke="#60a5fa"/>
    <path d="M486 565 C650 565 720 541 905 541" stroke="#ef4444"/>
    <path d="M486 630 C650 630 720 606 905 606" stroke="#a78bfa"/>
    <path d="M486 695 C650 695 720 671 905 671" stroke="#94a3b8"/>
  </g>

  <!-- Arduino -->
  <g filter="url(#shadow)">
    <rect x="70" y="160" width="420" height="610" rx="24" fill="#0d6d68" stroke="#4ee0d5" stroke-width="4"/>
    <text x="280" y="210" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="30" font-weight="700">ARDUINO UNO R3</text>
    <rect x="92" y="236" width="105" height="72" rx="8" fill="#cbd5e1" stroke="#e2e8f0" stroke-width="3"/><text x="144" y="280" text-anchor="middle" fill="#334155" font-family="Arial,sans-serif" font-size="18" font-weight="700">USB-B</text>
    <rect x="92" y="334" width="86" height="56" rx="28" fill="#111827"/><text x="135" y="420" text-anchor="middle" fill="#dbeafe" font-family="Arial,sans-serif" font-size="16">DC JACK</text>
    <rect x="235" y="254" width="178" height="250" rx="14" fill="#102f35" stroke="#7dd3fc" stroke-width="2"/>
    <text x="324" y="292" text-anchor="middle" fill="#bff7f1" font-family="monospace" font-size="16">ATmega328P</text>
    <text x="324" y="326" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="14">32 KB FLASH</text>
    <text x="324" y="354" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="14">2 KB SRAM</text>
    <text x="324" y="382" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="14">16 MHz</text>

    <g font-family="monospace" font-size="18" font-weight="700">
      <g fill="#ffdddd"><circle cx="450" cy="240" r="11"/><text x="420" y="246" text-anchor="end">D10</text></g>
      <g fill="#ffe5c2"><circle cx="450" cy="305" r="11"/><text x="420" y="311" text-anchor="end">D8</text></g>
      <g fill="#fff3ad"><circle cx="450" cy="370" r="11"/><text x="420" y="376" text-anchor="end">D9</text></g>
      <g fill="#bff5df"><circle cx="450" cy="435" r="11"/><text x="420" y="441" text-anchor="end">D11</text></g>
      <g fill="#bfdbfe"><circle cx="450" cy="500" r="11"/><text x="420" y="506" text-anchor="end">D13</text></g>
      <g fill="#fecaca"><circle cx="450" cy="565" r="11"/><text x="420" y="571" text-anchor="end">5V</text></g>
      <g fill="#ddd6fe"><circle cx="450" cy="630" r="11"/><text x="420" y="636" text-anchor="end">3.3V</text></g>
      <g fill="#cbd5e1"><circle cx="450" cy="695" r="11"/><text x="420" y="701" text-anchor="end">GND</text></g>
    </g>
  </g>

  <!-- TFT -->
  <g filter="url(#shadow)">
    <rect x="905" y="160" width="425" height="610" rx="24" fill="#0a6f86" stroke="#67e8f9" stroke-width="4"/>
    <text x="1118" y="204" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="27" font-weight="700">1.8&quot; 128×160 ST7735S</text>
    <rect x="1068" y="236" width="224" height="330" rx="8" fill="#d5dbe1" stroke="#e2e8f0" stroke-width="7"/>
    <rect x="1085" y="255" width="190" height="292" fill="#13283a"/>
    <text x="1180" y="372" text-anchor="middle" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="23" font-weight="700">CODEX PET</text>
    <text x="1180" y="413" text-anchor="middle" fill="#f87171" font-family="Arial,sans-serif" font-size="16">animated pet</text>
    <rect x="1085" y="512" width="190" height="35" fill="#24384a"/><circle cx="1103" cy="530" r="6" fill="#6ee7b7"/><text x="1117" y="535" fill="#fff" font-family="monospace" font-size="16">RUNNING</text>

    <g font-family="monospace" font-size="18" font-weight="700">
      <g fill="#ffdddd"><circle cx="925" cy="216" r="11"/><text x="950" y="222">CS</text></g>
      <g fill="#ffe5c2"><circle cx="925" cy="281" r="11"/><text x="950" y="287">DC</text></g>
      <g fill="#fff3ad"><circle cx="925" cy="346" r="11"/><text x="950" y="352">RST</text></g>
      <g fill="#bff5df"><circle cx="925" cy="411" r="11"/><text x="950" y="417">SDA / MOSI</text></g>
      <g fill="#bfdbfe"><circle cx="925" cy="476" r="11"/><text x="950" y="482">SCL / SCK</text></g>
      <g fill="#fecaca"><circle cx="925" cy="541" r="11"/><text x="950" y="547">VDD (5V)</text></g>
      <g fill="#ddd6fe"><circle cx="925" cy="606" r="11"/><text x="950" y="612">BLK (3.3V)</text></g>
      <g fill="#cbd5e1"><circle cx="925" cy="671" r="11"/><text x="950" y="677">GND</text></g>
    </g>
  </g>

  <g font-family="Arial,sans-serif">
    <rect x="70" y="806" width="1260" height="58" rx="14" fill="#3a1720" stroke="#fb7185" stroke-width="2"/>
    <text x="700" y="833" text-anchor="middle" fill="#ffe4e6" font-size="20" font-weight="700">VERIFIED MODULE: VDD = 5V · BLK = 3.3V</text>
    <text x="700" y="855" text-anchor="middle" fill="#fecdd3" font-size="15">Direct 5V GPIO is breakout-specific — otherwise use 3.3V and level translation</text>
  </g>
</svg>
