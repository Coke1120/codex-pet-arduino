name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.9"
      - run: python -m pip install -r mac/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "import glob, py_compile; [py_compile.compile(p, doraise=True) for pattern in ('mac/*.py', 'tools/*.py', 'tests/*.py') for p in glob.glob(pattern)]"
      - name: Parse Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path windows/install.ps1), [ref]$null, [ref]$errors) > $null
          if ($errors.Count) { $errors | Out-String | Write-Error; exit 1 }

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2
        with:
          version: "1.5.1"
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr@1.8.8
      - run: arduino-cli lib install "TFT_eSPI@2.5.43"
      - run: cp config/User_Setup.h "$HOME/Arduino/libraries/TFT_eSPI/User_Setup.h"
      - run: arduino-cli compile --fqbn arduino:avr:uno --warnings all arduino/CodexPet

  esp32-p4-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae # v1 branch snapshot
        with:
          version: v5.5.1
      - working-directory: esp32-p4
        run: |
          idf.py set-target esp32p4
          grep -q '^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_MODE_HEX=y$' sdkconfig
          grep -q '^CONFIG_SPIRAM_SPEED_80M=y$' sdkconfig
          grep -q '^CONFIG_LV_DRAW_SW_SUPPORT_RGB565A8=y$' sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM=y$' sdkconfig
          test "$(git -C .. status --porcelain -- esp32-p4/dependencies.lock)" = ""
      - working-directory: esp32-p4
        run: idf.py build
