name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: python -m pip install -r mac/requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile mac/*.py tools/*.py tests/*.py

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: "1.x"
      - run: arduino-cli core update-index
      - run: arduino-cli core install arduino:avr
      - run: arduino-cli lib install "TFT_eSPI@2.5.43"
      - run: cp config/User_Setup.h "$HOME/Arduino/libraries/TFT_eSPI/User_Setup.h"
      - run: arduino-cli compile --fqbn arduino:avr:uno --warnings all arduino/CodexPet
