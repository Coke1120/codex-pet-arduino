name: Bug report
description: Report a reproducible JC4880P443C-I-W firmware or macOS host problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Remove personal paths, usernames, port inventories, credentials, and private logs before submitting.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - ESP32-P4 display, touch, or USB Serial
        - ESP32-C6 Wi-Fi or BLE
        - Codex Pet v2 actions or assets
        - macOS host runtime
        - Today, Settings, or Codex Usage UI
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      description: Confirm the JC4880P443C-I-W PCB revision and relevant connector. Do not include serial numbers or port inventories.
      placeholder: JC4880P443C-I-W revision 1.3, P4 native USB connector
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Build or install...
        2. Send a command or use a gesture...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitised logs or compiler output
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed personal paths, usernames, credentials, serial numbers, and unrelated private data.
          required: true
        - label: This report concerns the JC4880P443C-I-W hardware or macOS host runtime.
          required: true
