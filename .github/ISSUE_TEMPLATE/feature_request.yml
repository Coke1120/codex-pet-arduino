name: Feature request
description: Suggest a JC4880P443C-I-W or macOS companion improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What should the project make easier or more useful?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the state, protocol, v2 action, touch UI, macOS integration, or hardware change.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: P4 and macOS scope considerations
      description: Mention flash, PSRAM, timing, display, touch, radio, privacy, or macOS trade-offs. Requests for other boards or host operating systems are out of scope.
    validations:
      required: true
